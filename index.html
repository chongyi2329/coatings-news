<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球塗料產業動態 - The Coatings Post</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        // 引入襯線字體，增加雜誌質感
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        magazine: {
                            bg: '#faf9f6',
                            darkbg: '#1a1a1a',
                            accent: '#b91c1c', // 雜誌紅
                        }
                    }
                }
            }
        }
    </script>

    <!-- 引入字體與圖示 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap');
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-magazine-bg text-gray-900 dark:bg-magazine-darkbg dark:text-gray-100 min-h-screen">

    <!-- 頂部小工具列 -->
    <div class="border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-2 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
            <div>
                <span id="current-date"></span>
            </div>
            <div class="flex gap-4">
                <button id="refresh-btn" class="hover:text-black dark:hover:text-white transition-colors flex items-center gap-1">
                    <i class="ph ph-arrows-clockwise text-sm"></i> 重新整理
                </button>
                <button id="theme-toggle" class="hover:text-black dark:hover:text-white transition-colors flex items-center gap-1">
                    <i id="theme-icon" class="ph ph-moon text-sm"></i> <span id="theme-text">深色模式</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 雜誌標題 Header -->
    <header class="border-b-2 border-black dark:border-gray-600 py-6 px-4 md:px-8 max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-3xl md:text-5xl font-serif font-black tracking-tight">The Coatings Post</h1>
        <div class="text-right hidden md:block">
            <p class="text-sm font-bold uppercase tracking-widest text-magazine-accent">Daily Digest</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Global Industry News</p>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 md:px-8 py-10">
        
        <!-- 狀態顯示 -->
        <div id="status-message" class="text-center py-20 text-gray-500 dark:text-gray-400">
            <i class="ph ph-spinner animate-spin text-4xl mb-4"></i>
            <p class="font-serif text-lg">正在載入最新產業動態...</p>
        </div>

        <!-- 雜誌網格佈局 (由 JS 填入內容) -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-12 gap-10 hidden">
            <!-- 內容動態產生 -->
        </div>

    </main>

    <footer class="border-t border-gray-200 dark:border-gray-800 py-8 mt-10 text-center text-sm text-gray-500 font-serif">
        <p>© <script>document.write(new Date().getFullYear())</script> The Coatings Post. Automated via GitHub Actions.</p>
    </footer>

    <script>
        // --- 1. 日期顯示 ---
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-TW', dateOptions);

        // --- 2. 深色模式切換邏輯 ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const htmlElement = document.documentElement;

        function updateThemeUI(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                themeIcon.classList.replace('ph-moon', 'ph-sun');
                themeText.textContent = "淺色模式";
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.classList.replace('ph-sun', 'ph-moon');
                themeText.textContent = "深色模式";
            }
        }

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            updateThemeUI(true);
        }

        themeToggleBtn.addEventListener('click', function() {
            const isDark = htmlElement.classList.contains('dark');
            updateThemeUI(!isDark);
            localStorage.setItem('color-theme', !isDark ? 'dark' : 'light');
        });

        // --- 3. 新聞資料載入與渲染邏輯 ---
        const newsContainer = document.getElementById('news-container');
        const statusMessage = document.getElementById('status-message');
        const refreshBtn = document.getElementById('refresh-btn');

        function renderNews(newsData) {
            newsContainer.innerHTML = '';
            
            if (newsData.length === 0) {
                statusMessage.innerHTML = '<i class="ph ph-warning-circle text-4xl mb-4"></i><p class="font-serif">目前沒有最新新聞</p>';
                statusMessage.classList.remove('hidden');
                return;
            }

            // 將第一則設為頭條，其餘作為側邊欄
            const heroArticle = newsData[0];
            const sideArticles = newsData.slice(1);

            // 構建頭條 HTML
            const heroHTML = `
                <article class="md:col-span-8 flex flex-col justify-center border-b md:border-b-0 md:border-r border-gray-300 dark:border-gray-700 pb-10 md:pb-0 md:pr-10">
                    <span class="uppercase tracking-widest text-xs font-bold text-magazine-accent mb-4 block">Headlines · ${heroArticle.source}</span>
                    <a href="${heroArticle.url}" target="_blank" rel="noopener noreferrer" class="group block">
                        <h2 class="text-3xl md:text-5xl font-serif font-bold leading-tight mb-6 group-hover:text-magazine-accent transition-colors">
                            ${heroArticle.title}
                        </h2>
                    </a>
                    <p class="text-lg text-gray-600 dark:text-gray-300 leading-relaxed mb-6 font-serif">
                        ${heroArticle.summary}
                    </p>
                    <div class="flex items-center gap-4 mt-auto">
                        <span class="text-sm text-gray-400 dark:text-gray-500 uppercase tracking-wider">${heroArticle.publishedAt}</span>
                    </div>
                </article>
            `;

            // 構建側邊欄 HTML
            let sideHTML = '<div class="md:col-span-4 flex flex-col gap-8">';
            sideArticles.forEach(item => {
                sideHTML += `
                    <article class="border-b border-gray-200 dark:border-gray-800 pb-8 last:border-0 last:pb-0">
                        <span class="uppercase tracking-widest text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-2 block">${item.source}</span>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="group block">
                            <h3 class="text-xl font-serif font-bold leading-snug mb-3 group-hover:text-magazine-accent transition-colors">
                                ${item.title}
                            </h3>
                        </a>
                        <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-3 mb-3">${item.summary}</p>
                        <span class="text-xs text-gray-400 dark:text-gray-500 uppercase">${item.publishedAt}</span>
                    </article>
                `;
            });
            sideHTML += '</div>';

            // 組合並渲染
            newsContainer.innerHTML = heroHTML + sideHTML;
        }

        async function fetchNews() {
            statusMessage.classList.remove('hidden');
            newsContainer.classList.add('hidden');
            
            try {
                // 加上時間戳防止瀏覽器快取
                const response = await fetch('news.json?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error("尚未產生新聞資料");
                
                const data = await response.json();
                renderNews(data);
                
                statusMessage.classList.add('hidden');
                newsContainer.classList.remove('hidden');
            } catch (error) {
                console.error("載入新聞失敗:", error);
                statusMessage.innerHTML = '<i class="ph ph-newspaper text-4xl mb-4 text-gray-400"></i><p class="font-serif">等待機器人抓取今日新聞...</p>';
                statusMessage.classList.remove('hidden');
            }
        }

        refreshBtn.addEventListener('click', fetchNews);
        document.addEventListener('DOMContentLoaded', fetchNews);

    </script>
</body>
</html>
