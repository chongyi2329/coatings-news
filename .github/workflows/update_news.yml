name: Daily News Updater

設定何時觸發此流程

on:
schedule:
# 每天 UTC 時間 00:00 (台灣時間早上 08:00) 和 UTC 10:00 (台灣時間晚上 18:00) 執行
- cron: '0 0,10 * * *'
workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行

設定權限，讓機器人可以把產生的 JSON 推回資料庫

permissions:
contents: write

jobs:
update-news:
runs-on: ubuntu-latest

steps:
  - name: 取得最新的原始碼
    uses: actions/checkout@v4

  - name: 設定 Python 環境
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: 安裝依賴套件
    run: pip install -r requirements.txt

  - name: 執行爬蟲與翻譯腳本
    run: python fetch_news.py

  - name: 提交更新的 news.json
    run: |
      git config --global user.name 'github-actions[bot]'
      git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      git add news.json
      git commit -m "自動更新新聞資料 [skip ci]" || echo "沒有新的變更"
      git push
